# Docker path: replace the online_store + offline_store blocks above with the
# following (Feast online→Redis, offline pulls from Postgres). After NB4 writes
# Parquet, run: python scripts/sync_feast_parquet_to_postgres.py then feast apply.
#
project: lab19
provider: local
registry: registry.db
online_store:
  type: redis
  connection_string: localhost:6380
offline_store:
  type: postgres
  host: localhost
  port: 5432
  database: feast_offline
  user: feast
  password: feast
  db_schema: public
  sslmode: disable
entity_key_serialization_version: 3